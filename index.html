<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fdf6e3, #f5e6c8);
      color: #222;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: #222;
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      padding: 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      padding: 8px 12px;
      border-radius: 6px;
      transition: 0.3s;
    }

    nav ul li a:hover {
      background: #f4b400;
      color: #111;
    }

    main {
      flex: 1;
      width: 100%;
      padding: 30px 15px;
    }

    #home {
      max-width: 1000px;
      margin: auto;
      text-align: center;
      padding: 25px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    #home h1 {
      font-size: 38px;
      margin-bottom: 25px;
      color: #2c2c2c;
    }

    .bounce {
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .carousel {
      width: 100%;
      max-width: 420px;
      height: 420px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.2);
    }

    .carousel-inner {
      display: flex;
      width: 400%;
      height: 100%;
      animation: slide 16s infinite;
    }

    .carousel-item {
      width: 25%;
      height: 100%;
      flex-shrink: 0;
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes slide {
      0%, 20% {
        transform: translateX(0);
      }
      25%, 45% {
        transform: translateX(-25%);
      }
      50%, 70% {
        transform: translateX(-50%);
      }
      75%, 95% {
        transform: translateX(-75%);
      }
      100% {
        transform: translateX(0);
      }
    }

    .contact-boxes {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 30px;
    }

    .contact-box {
      width: 150px;
      min-height: 110px;
      background: #fff7df;
      border-radius: 14px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      transition: 0.3s;
    }

    .contact-box:hover {
      transform: translateY(-6px);
      background: #ffe9a8;
    }

    .contact-box img {
      width: 35px;
      height: 35px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .contact-box a {
      text-decoration: none;
      color: #222;
      font-weight: bold;
      font-size: 15px;
    }

    footer {
      width: 100%;
      text-align: center;
      background: #222;
      color: white;
      padding: 15px 10px;
      font-size: 15px;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      nav ul {
        flex-direction: column;
        gap: 8px;
        padding: 12px;
      }

      nav ul li a {
        font-size: 15px;
        display: block;
      }

      main {
        padding: 20px 12px;
      }

      #home {
        padding: 20px 12px;
        border-radius: 14px;
      }

      #home h1 {
        font-size: 29px;
      }

      .carousel {
        max-width: 320px;
        height: 320px;
      }

      .contact-boxes {
        gap: 12px;
      }

      .contact-box {
        width: 135px;
        min-height: 100px;
      }
    }

    @media (max-width: 480px) {
      #home h1 {
        font-size: 24px;
      }

      .carousel {
        max-width: 260px;
        height: 260px;
      }

      .contact-box {
        width: 100%;
        max-width: 250px;
      }

      footer {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <ul class="nav-boxes">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="experience.html">Experience & Certificates</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="activities.html">Extra-Curricular Activities</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="home">
      <h1 class="bounce">Welcome to My Portfolio</h1>

      <div class="carousel">
        <div class="carousel-inner">
          <div class="carousel-item"><img src="pics/me1.jpg" alt="My Photo 1"></div>
          <div class="carousel-item"><img src="pics/me2.jpg" alt="My Photo 2"></div>
          <div class="carousel-item"><img src="pics/2.jpeg" alt="My Photo 3"></div>
          <div class="carousel-item"><img src="pics/3.jpeg" alt="My Photo 4"></div>
        </div>
      </div>

      <div class="contact-boxes">
        <div class="contact-box">
          <img src="pics/insta.png" alt="Instagram Icon">
          <a href="https://www.instagram.com/basitbhat119/" target="_blank">Instagram</a>
        </div>

        <div class="contact-box">
          <img src="pics/gmail.png" alt="Gmail Icon">
          <a href="mailto:ibasitzahoor@gmail.com">Mail</a>
        </div>

        <div class="contact-box">
          <img src="pics/linkedIn.png" alt="LinkedIn Icon">
          <a href="https://www.linkedin.com/in/basit-zahoor/" target="_blank">LinkedIn</a>
        </div>

        <div class="contact-box">
          <img src="pics/github.png" alt="GitHub Icon">
          <a href="https://github.com/basitzahoor" target="_blank">GitHub</a>
        </div>

        <div class="contact-box">
          <img src="pics/cv.png" alt="CV Icon">
          <a href="https://drive.google.com/file/d/17W-kSJrpiJ8VEq6jLW6hC7ENJWPGCgmW/view?usp=sharing" target="_blank">My CV</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Basit Zahoor</p>
  </footer>

</body>
</html>
